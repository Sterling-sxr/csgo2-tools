name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloud-api/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.22.0
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Type-check Worker
        run: pnpm cloud:typecheck

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment skipped. Configure the CLOUDFLARE_API_TOKEN production secret and CLOUDFLARE_ACCOUNT_ID repository variable."
          fi

      - name: Deploy Worker
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloud-api/wrangler.jsonc

      - name: Record skipped deployment
        if: steps.credentials.outputs.available != 'true'
        shell: bash
        run: |
          {
            echo "## Cloudflare deployment skipped"
            echo "The Worker passed type-checking, but the production deployment credential is not configured yet."
            echo "Add the repository secret \`CLOUDFLARE_API_TOKEN\` and variable \`CLOUDFLARE_ACCOUNT_ID\`, then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
